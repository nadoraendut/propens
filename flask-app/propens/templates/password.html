{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px"><h1>Change password</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Current password</label><input name="current" type="password" required style="width:100%">
<label>New password (min 8 characters)</label><input name="new" type="password" required style="width:100%">
<p><button>Save</button></p></form></div>{% endblock %}
