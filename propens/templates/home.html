{% extends "base.html" %}{% block body %}
<div class="card"><div class="row"><h1 style="flex:1;margin:0">Semesters</h1>
{% if role=='admin' %}<a class="btn" href="{{ url_for('main.semester_new') }}">New semester</a>
<form class="inline" method="post" action="{{ url_for('main.run_reminders') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="sec">Send due reminders</button></form>{% endif %}</div>
<table><tr><th>Semester</th><th>Min %</th><th>State</th><th></th></tr>
{% for s in semesters %}<tr><td><a href="{{ url_for('main.semester', sid=s.id) }}">{{ s.name }}</a></td><td>{{ '%g'|format(s.min_percent) }}%</td>
<td><span class="badge">{{ s.state.replace('_',' ') }}</span></td><td><a href="{{ url_for('main.report', sid=s.id) }}">Report</a></td></tr>
{% else %}<tr><td class="mut">No semesters yet.</td></tr>{% endfor %}</table></div>{% endblock %}
