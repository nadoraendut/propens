{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px"><h1>New semester</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Semester name</label><input name="name" placeholder="e.g. Sem 1 2026/2027" required style="width:100%">
<label>Minimum % of lecturers to audit (applied to every department)</label><input name="min_percent" type="number" step="0.1" min="0.1" max="100" value="20" required>
<p><button>Create</button></p></form></div>{% endblock %}
