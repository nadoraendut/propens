<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Audit Draw{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#e3e6ec;--pri:#2b5fd9;--ok:#16794c;--warn:#a15c00;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--mut:#98a2b3;--line:#2c3340;--pri:#6b93ff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}header b{color:var(--pri)}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--mut)}.scroll{overflow-x:auto}
input,textarea,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
button,.btn{background:var(--pri);color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block;padding:8px 16px;border-radius:7px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}.mut{color:var(--mut)}.good{color:var(--ok)}.bad{color:var(--err)}.warn{color:var(--warn)}
.flash{padding:9px 13px;border-radius:8px;margin-bottom:12px;border:1px solid var(--err);color:var(--err)}
.note{padding:9px 13px;border-radius:8px;margin-bottom:12px;border:1px solid var(--warn);color:var(--warn)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:26px}.badge{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
form.inline{display:inline}a{color:var(--pri)}
</style></head><body>
<header><b>Audit Draw</b> <span class="mut">· fair selection of auditees and auditors</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
